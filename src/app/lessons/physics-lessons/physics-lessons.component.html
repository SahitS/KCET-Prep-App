<div class="lessons-container">
    <!-- Year Selection -->
    <div class="year-selection">
      <h2>Select a Year</h2>
      <button *ngFor="let year of years" (click)="onYearSelect(year)" class="year-btn">
        {{ year }}
      </button>
    </div>
  
    <!-- Chapter Listing -->
    <div class="chapter-list" *ngIf="selectedYear">
      <h2>{{ selectedYear }} Chapters</h2>
      <ul>
        <li *ngFor="let chapter of chapters" (click)="onChapterSelect(chapter)" class="chapter-item">
          {{ chapter.name }}
        </li>
      </ul>
    </div>
  
    <!-- Flashcard Viewer -->
    <div class="flashcard-viewer" *ngIf="selectedChapter">
      <h3>{{ selectedChapter.name }}</h3>
      <div class="flashcard" *ngFor="let flashcard of flashcards">
        <h4>{{ flashcard.title }}</h4>
        <p *ngFor="let explanation of flashcard.explanation">{{ explanation }}</p>
        <ul>
          <li *ngFor="let formula of flashcard.formulas">{{ formula }}</li>
        </ul>
      </div>
    </div>
  </div>
