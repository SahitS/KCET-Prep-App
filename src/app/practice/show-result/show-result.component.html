<div class="results-container">
  <h1>Your Results</h1>
  
  <!-- Total Score Section -->
  <div class="total-score-card">
    <h2>Total Score</h2>
    <p>{{ totalScore }}/90</p>
  </div>

  <!-- Individual Scores Section -->
  <div class="scores-section">
    <div class="score-box">
      <h3>Physics</h3>
      <p>{{ scores.physics }}/30</p>
    </div>
    <div class="score-box">
      <h3>Chemistry</h3>
      <p>{{ scores.chemistry }}/30</p>
    </div>
    <div class="score-box">
      <h3>Math</h3>
      <p>{{ scores.math }}/30</p>
    </div>
  </div>

  <!-- Back to Dashboard Button -->
  <button class="btn-back" (click)="goToHome()">Back to Dashboard</button>
</div>
