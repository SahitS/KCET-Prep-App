<div class="results-container">
    <h1>Your Results</h1>
    <div class="score-card">
      <p><strong>Physics:</strong> {{ scores.physics }}/30</p>
      <p><strong>Chemistry:</strong> {{ scores.chemistry }}/30</p>
      <p><strong>Math:</strong> {{ scores.math }}/30</p>
    </div>
    <div class="total-score">
      <h2>Total Score: {{ totalScore }}/90</h2>
    </div>
    <button class="btn-back" (click)="goToHome()">Back to Dashboard</button>
  </div>
