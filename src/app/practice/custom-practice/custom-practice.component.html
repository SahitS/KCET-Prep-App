<div class="custom-practice-container">
  <h1 class="text-center">Custom Practice Session</h1>

  <!-- Subject Navbar -->
  <div class="navbar-container">
    <ul class="subject-navbar">
      <li
        *ngFor="let subject of subjects"
        [class.active]="selectedSubject === subject"
        (click)="fetchTopics(subject)"
      >
        {{ subject }}
      </li>
    </ul>
  </div>

  <!-- Topic and Subtopic Selection for the Selected Subject -->
  <div *ngIf="selectedSubject && !isSessionStarted" class="practice-options">
    <h2>Select Topics and Subtopics for {{ selectedSubject }}</h2>

    <!-- Loading Indicator -->
    <div *ngIf="isLoading" class="loading-spinner">Loading topics...</div>

    <!-- Topics and Subtopics -->
    <div *ngIf="!isLoading">
      <div class="topics-container">
        <h3>Topics</h3>
        <div class="checkbox-list">
          <label *ngFor="let topic of topics">
            <input
              type="checkbox"
              [value]="topic"
              (change)="toggleTopic(topic)"
              [checked]="selectedTopics.includes(topic)"
            />
            {{ topic }}
          </label>
        </div>
      </div>

      <div class="subtopics-container" *ngFor="let topic of selectedTopics">
        <h3>Subtopics for {{ topic }}</h3>
        <div class="checkbox-list">
          <label *ngFor="let subtopic of subtopics[topic]">
            <input
              type="checkbox"
              [value]="subtopic"
              (change)="toggleSubtopic(topic, subtopic)"
              [checked]="selectedSubtopics[topic]?.includes(subtopic)"
            />
            {{ subtopic }}
          </label>
        </div>
      </div>
    </div>

    <div class="difficulty-container">
      <h3>Select Difficulty</h3>
      <select [(ngModel)]="selectedDifficulty">
        <option *ngFor="let level of difficultyLevels" [value]="level">
          {{ level }}
        </option>
      </select>
    </div>

    <button class="btn btn-primary" (click)="startSession()">Start Session</button>
  </div>

  <!-- Practice Session -->
  <div *ngIf="isSessionStarted" class="question-container">
    <h2>Question {{ currentQuestionIndex + 1 }}</h2>
    <p>{{ currentQuestion.Question }}</p>

    <!-- Options -->
    <div class="options">
      <label *ngFor="let option of ['Option_1', 'Option_2', 'Option_3', 'Option_4']">
        <input
          type="radio"
          name="options"
          [value]="option"
          [disabled]="isAnswered"
          (change)="selectOption(option)"
        />
        {{ currentQuestion[option] }}
      </label>
    </div>

    <!-- Feedback -->
    <div *ngIf="isAnswered" class="feedback">
      <p [class.correct]="isAnswerCorrect" [class.incorrect]="!isAnswerCorrect">
        {{ isAnswerCorrect ? 'Correct!' : 'Incorrect!' }}
      </p>
    </div>

    <!-- Navigation -->
    <div class="navigation-buttons">
      <button
        *ngIf="!isAnswered"
        class="btn btn-submit"
        [disabled]="!selectedOption"
        (click)="submitAnswer()"
      >
        Submit
      </button>
      <button
        *ngIf="isAnswered && currentQuestionIndex < customPractice.length - 1"
        class="btn btn-next"
        (click)="nextQuestion()"
      >
        Next Question
      </button>
      <button
        *ngIf="isAnswered && currentQuestionIndex === customPractice.length - 1"
        class="btn btn-finish"
        (click)="finishPractice()"
      >
        Finish Practice
      </button>
    </div>
  </div>
</div>
