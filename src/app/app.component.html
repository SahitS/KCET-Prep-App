<body class="full-page-container d-flex flex-column">
  <!-- Banner for Announcements -->
  <div class="banner">
    🎉 Limited time offer: Get 15% off on all study plans with code <strong>LEARN15</strong>! Expires on November 20.
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" routerLink="/">PrepSphere</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/lessons">Lessons</a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="practiceDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Practice
            </a>
            <ul class="dropdown-menu" aria-labelledby="practiceDropdown">
              <li>
                <a class="dropdown-item" routerLink="/practice-test">Personalized Study Plan</a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/custom-practice">Custom Practice</a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/review-questions">Review Questions</a>
              </li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/progress">Progress</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/account">Account</a>
          </li>
        </ul>
        <button class="btn btn-outline-warning ms-2" (click)="onLogout()">Logout</button>
      </div>
    </div>
  </nav>

   <!-- Main Content Section -->
   <div class="main-content container my-5 flex-grow-1">
    <router-outlet></router-outlet> <!-- This will dynamically load routed components -->
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 PrepSphere. All rights reserved.</p>
  </footer>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
