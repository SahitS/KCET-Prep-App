<div class="mock-test-container" *ngIf="quiz">
    <h2 class="header">
      {{ currentSection | titlecase }} Section
      <span class="timer">Time Left: {{ getFormattedTime() }}</span>
    </h2>
  
    <div class="section-switcher">
      <button
        *ngFor="let section of ['physics', 'chemistry', 'mathematics']"
        [ngClass]="{ active: currentSection === section }"
        (click)="navigateSection(section)"
      >
        {{ section | titlecase }}
      </button>
    </div>
  
    <div class="quiz-content">
      <div class="question-box">
        <h3>Question {{ currentQuestionIndex + 1 }}</h3>
        <div class="image-container">
          <div class="scrollable-content">
            <img
              [src]="quiz[currentSection][currentQuestionIndex]?.imagePath"
              alt="Question"
            />
          </div>
        </div>
        <div class="options">
          <button
            *ngFor="let option of ['A', 'B', 'C', 'D']"
            [ngClass]="{
              selected: getAnswerForCurrentQuestion()?.selectedOption === option
            }"
            (click)="selectAnswer(
              quiz[currentSection][currentQuestionIndex]?.questionIndex,
              option
            )"
          >
            {{ option }}
          </button>
        </div>
      </div>
  
      <div class="navigator">
        <h3>Question Navigator</h3>
        <div class="navigator-grid">
          <button
            *ngFor="let question of quiz[currentSection]; let i = index"
            [ngClass]="getQuestionClass(i)"
            (click)="currentQuestionIndex = i"
          >
            {{ i + 1 }}
          </button>
        </div>
      </div>
    </div>
  
    <div class="navigation-buttons">
      <button (click)="previousQuestion()" [disabled]="currentQuestionIndex === 0">
        Previous
      </button>
      <button (click)="markForReview()">Mark for Review</button>
      <button
        (click)="nextQuestion()"
        [disabled]="
          currentQuestionIndex === quiz[currentSection].length - 1
        "
      >
        Next
      </button>
      <button (click)="submitQuiz()" class="submit-button">Submit Quiz</button>
      <button (click)="confirmGoBack()">Back to Dashboard</button>
    </div>
  
    <div class="overlay" *ngIf="showOverlay">
      <div class="overlay-content">
        <h2>Enter your PUC Scores</h2>
        <form #pucForm="ngForm" (ngSubmit)="predictRank(pucForm.value)">
          <label>
            Physics:
            <input type="number" name="physics" required ngModel />
          </label>
          <label>
            Chemistry:
            <input type="number" name="chemistry" required ngModel />
          </label>
          <label>
            Mathematics:
            <input type="number" name="math" required ngModel />
          </label>
          <button type="submit">Predict Rank</button>
          <button type="button" (click)="closeOverlay()">Cancel</button>
        </form>
      </div>
    </div>
  
    <div class="rank-display" *ngIf="predictedRank">
      <h2>Your Predicted Rank</h2>
      <p>{{ predictedRank }}</p>
      <button (click)="redirectToDashboard()">Okay</button>
    </div>
  </div>
